name: Reproducibility Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  reproduce:
    name: Reproduce manuscript computations
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check installed packages
        run: python -m pip check

      - name: Run reproducibility computations
        run: |
          python reproduce_results.py | tee reproducibility_output.txt

      - name: Upload reproducibility log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-output
          path: reproducibility_output.txt
