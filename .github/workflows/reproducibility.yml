name: Reproducibility Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce manuscript computations
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check installed packages
        run: python -m pip check

      - name: Run reproducibility computations
        run: |
          python reproduce_results.py | tee reproducibility_output.txt

      - name: Upload reproducibility log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-output
          path: reproducibility_output.txt
